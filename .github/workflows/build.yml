name: Build Bird Client

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2"

      - name: Extract client ZIP
        run: |
          unzip -q bird-client.zip -d extracted

      - name: Build client
        working-directory: extracted/bird-client
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: bird-client-jar
          path: extracted/bird-client/build/libs/*.jar
          if-no-files-found: error
